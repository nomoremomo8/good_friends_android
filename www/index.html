<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Good Friends 旅行记账管家</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf8f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;color:#0f172a}button,input,select,textarea{font-family:inherit}button{cursor:pointer}.app{max-width:430px;margin:0 auto;min-height:100vh;background:#f8fffd;padding-bottom:105px}.hero{background:linear-gradient(135deg,#0284c7,#0d9488 55%,#0f766e);color:#fff;border-radius:0 0 32px 32px;padding:22px}.top{display:flex;justify-content:space-between;gap:10px}.pill{border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;background:#ecfeff;color:#0f766e}.hero .pill{background:rgba(255,255,255,.16);color:white}.newBtn{background:#facc15!important;color:#134e4a!important}.title{font-size:25px;font-weight:900;line-height:1.2;margin:18px 0 16px;word-break:break-word}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metrics small{opacity:.55}.metrics b{font-size:18px}.progress{height:22px;background:rgba(9,78,82,.34);border-radius:999px;overflow:hidden;position:relative;box-shadow:inset 0 2px 6px rgba(0,0,0,.25),inset 0 -1px 2px rgba(255,255,255,.18);margin-top:18px}.progressFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#fde047,#fbbf24 45%,#f59e0b);box-shadow:inset 0 2px 4px rgba(255,255,255,.48),inset 0 -2px 5px rgba(180,83,9,.28),0 0 18px rgba(251,191,36,.38)}.progressText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.35)}.page{display:none;padding:16px}.page.active{display:block}.card{background:#fff;border:1px solid #dff3ee;border-radius:28px;padding:18px;box-shadow:0 12px 32px rgba(13,148,136,.08);margin-bottom:14px}h2{margin:0 0 10px;font-size:20px}.muted{color:#94a3b8;font-size:12px}.avatar,.circle{border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 8px 18px rgba(15,23,42,.12)}.avatar{width:76px;height:76px;margin:0 auto}.circle{width:48px;height:48px}.catIcon{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:0;position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 2px 7px rgba(255,255,255,.22),0 10px 20px rgba(15,23,42,.08);flex-shrink:0}.catIcon:before{content:"";display:block;width:30px;height:30px;background:var(--fg);mask:var(--mask) center/contain no-repeat;-webkit-mask:var(--mask) center/contain no-repeat}.ico-food{--g1:#f6d24f;--g2:#f28b45;--fg:#c76514;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M12 6h4v18h-4zM18 6h4v18h-4zM24 6h4v18a8 8 0 0 1-6 7.7V44h-6V31.7A8 8 0 0 1 10 24V6h4v18h2V6h2v18h2V6h4v18h2V6h2zm14 0c-6 0-10 5.5-10 13s4 13 10 13v12h6V6h-6z"/></svg>')}.ico-plane{--g1:#5fa8f6;--g2:#6b7ee8;--fg:#3159bb;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M43 31v-6L27 16V7a3 3 0 0 0-6 0v9L5 25v6l16-5v8l-6 4v4l9-2 9 2v-4l-6-4v-8l16 5z"/></svg>')}.ico-train{--g1:#58d0c4;--g2:#38a9cf;--fg:#147f9e;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M14 4h20a8 8 0 0 1 8 8v16a10 10 0 0 1-10 10l4 6h-7l-3-4h-4l-3 4h-7l4-6A10 10 0 0 1 6 28V12a8 8 0 0 1 8-8zm0 8v11h20V12H14zm4 21a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm12 0a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>')}.ico-hotel{--g1:#f2a0c9;--g2:#c59bea;--fg:#9b5abf;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M6 42V8h16v13h20v21h-6v-8H12v8H6zm6-14h24v-5H12v5zm4-10a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/></svg>')}.ico-ticket{--g1:#f5a04f;--g2:#ef6f5b;--fg:#c94e3a;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M6 12a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v8a5 5 0 0 0 0 10v8a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4v-8a5 5 0 0 0 0-10v-8z"/></svg>')}.ico-car{--g1:#7ed989;--g2:#34b56a;--fg:#19834a;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M11 17l4-8h18l4 8h2a6 6 0 0 1 6 6v14h-6v4h-7v-4H16v4H9v-4H3V23a6 6 0 0 1 6-6h2zm7-4l-2 4h16l-2-4H18zM13 30a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm22 0a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg>')}.ico-shop{--g1:#b89be8;--g2:#e08fcb;--fg:#a04f9a;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M12 15V9a7 7 0 0 1 14 0v6h4V9a7 7 0 0 1 14 0v6h3l-4 28H7L3 15h9zm5 0h4V9a2 2 0 0 0-4 0v6zm18 0h4V9a2 2 0 0 0-4 0v6z"/></svg>')}.ico-other{--g1:#a9b8c8;--g2:#8fa4bc;--fg:#586a82;--mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M24 4l5 15 15 5-15 5-5 15-5-15-15-5 15-5 5-15z"/></svg>')}.item{display:flex;align-items:center;gap:12px;border-bottom:1px solid #eef2f7;padding:12px 0}.btn{border:0;border-radius:16px;padding:12px;font-weight:900}.primary{background:#0d9488;color:#fff}.soft{background:#ecfeff;color:#0f766e}.danger{background:#fff1f2;color:#e11d48}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(410px,calc(100vw - 24px));height:78px;background:#fff;border-radius:28px;box-shadow:0 18px 45px rgba(15,23,42,.16);display:flex;align-items:center;justify-content:space-around;z-index:5}.nav button{border:0;background:transparent;font-weight:800;color:#64748b}.add{width:64px!important;height:64px!important;border-radius:50%!important;background:#0d9488!important;color:#fff!important;font-size:32px!important;margin-top:-34px}.field{background:#f8fafc;border-radius:16px;padding:12px;margin-top:10px}.reportbar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:10px}.reportbar i{display:block;height:100%;background:#0d9488}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{max-width:430px;width:100%;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:22px;max-height:86vh;overflow:auto}.dots{border:0;background:#f1f5f9;border-radius:999px;width:34px;height:34px;font-weight:900}.listrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eef2f7}.pos{color:#0d9488}.neg{color:#e11d48}input,select{width:100%;border:1px solid #e2e8f0;border-radius:14px;padding:11px;background:white;margin-top:6px}.seg{display:flex;gap:8px}.seg button{flex:1}.selected{outline:3px solid #0d948855}.hide{display:none}
.billItem{border:1px solid #dff3ee;border-radius:20px;background:#fff;margin:12px 0;overflow:hidden;box-shadow:0 8px 18px rgba(13,148,136,.06)}
.billHead{background:#ecfeff;border-bottom:1px solid #ccfbf1;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.billHead .meta{font-size:12px;color:#0f766e;font-weight:800}.billHead .name{font-size:15px;font-weight:900;margin-top:3px}.pricePill{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#b45309;border-radius:16px;padding:8px 10px;text-align:right;min-width:98px}.pricePill small{display:block;font-size:10px;opacity:.7}.pricePill b{font-size:16px}.billBody{padding:12px}.peopleBox{background:#f8fafc;border-radius:14px;padding:8px;margin-top:10px}.personRow,.participantRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #e2e8f0}.personRow:last-child,.participantRow:last-child{border-bottom:0}.personRow .left,.participantRow .left{flex:1;min-width:0}.weightBadge{background:#ecfeff;color:#0f766e;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;min-width:44px;text-align:center}.participantRow input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;margin:0}.exactInput{width:92px!important;margin:0!important;text-align:right}.modeBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modeBtns button{border:0;border-radius:14px;padding:11px;font-weight:900;background:#f1f5f9;color:#64748b}.modeBtns button.active{background:#0d9488;color:white}
</style></head><body><div id="app" class="app"></div><script>
const INITIAL_DATA = {"activeTripId": "trip_blank", "trips": [{"id": "trip_blank", "name": "我的第一次旅行", "budget": 0, "members": [{"id": "m1", "name": "我", "weight": 1, "isAdult": true, "isManager": true, "selected": true, "parentId": null, "parentName": null, "shortName": "我"}], "expenses": []}]};
const STORE='good_friends_app_v1';
const AVATAR_COLORS=['linear-gradient(135deg,#0d9488,#38bdf8)','linear-gradient(135deg,#f59e0b,#f97316)','linear-gradient(135deg,#6366f1,#a855f7)','linear-gradient(135deg,#a855f7,#ec4899)','linear-gradient(135deg,#fb7185,#f43f5e)','linear-gradient(135deg,#84cc16,#22c55e)','linear-gradient(135deg,#eab308,#f97316)','linear-gradient(135deg,#f97316,#fb7185)','linear-gradient(135deg,#06b6d4,#2563eb)'];
const CAT=['餐饮美食','机票','高铁票','酒店住宿','景点门票','租车自驾','零食超市','其他费用'];
const CAT_CLS={'餐饮美食':'ico-food','机票':'ico-plane','机票高铁':'ico-plane','高铁票':'ico-train','酒店住宿':'ico-hotel','景点门票':'ico-ticket','租车自驾':'ico-car','零食超市':'ico-shop','其他费用':'ico-other','其他':'ico-other'};
function clone(o){return JSON.parse(JSON.stringify(o))} function money(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})} function cleanName(n){return String(n||'').replace('(管家)','')} function today(){return new Date().toISOString().slice(0,10)}
let state=load(); let tab='members', modal=''; let filters={date:'',cat:'',payer:''}; let editing=null;
function load(){let s=localStorage.getItem(STORE); if(s){try{return JSON.parse(s)}catch(e){}} let d=clone(INITIAL_DATA); normalize(d); localStorage.setItem(STORE,JSON.stringify(d)); return d}
function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function normalize(db){(db.trips||[]).forEach(t=>{(t.members||[]).forEach((m,i)=>{m.name=cleanName(m.name); if(!m.avatarColor)m.avatarColor=AVATAR_COLORS[i%AVATAR_COLORS.length]; if(m.shortName==null)m.shortName=m.name.slice(0,2)}); (t.expenses||[]).forEach(e=>{if(e.category==='机票高铁')e.category='机票'; if(!e.date)e.date=today()})})}
function trip(){return state.trips.find(t=>t.id===state.activeTripId)||state.trips[0]} function mm(){let m={};trip().members.forEach(x=>m[x.id]=x);return m} function rootOf(id){let m=mm()[id];return m&&m.parentId?m.parentId:id}
function alloc(e){let map=mm(), out={}; if(e.splitMode==='exact'){Object.keys(e.exactAllocations||{}).forEach(id=>out[id]=Number(e.exactAllocations[id]||0));}else{let ps=e.participants||[], tw=ps.reduce((s,id)=>s+Number((map[id]||{}).weight||0),0); if(tw>0)ps.forEach(id=>out[id]=Number(e.amount||0)*Number((map[id]||{}).weight||0)/tw)} return out}
function calc(){let t=trip(), map=mm(), total=0, pc={},pp={},fc={},fp={}; t.members.forEach(m=>{pc[m.id]=0;pp[m.id]=0;fc[rootOf(m.id)]=fc[rootOf(m.id)]||0;fp[rootOf(m.id)]=fp[rootOf(m.id)]||0}); t.expenses.forEach(e=>{total+=Number(e.amount||0); pp[e.payerId]=(pp[e.payerId]||0)+Number(e.amount||0); fp[rootOf(e.payerId)]=(fp[rootOf(e.payerId)]||0)+Number(e.amount||0); let a=alloc(e); Object.keys(a).forEach(id=>{pc[id]=(pc[id]||0)+a[id];fc[rootOf(id)]=(fc[rootOf(id)]||0)+a[id]})}); let roots=t.members.filter(m=>!m.parentId).map(m=>m.id); let fams=roots.map(r=>{let owner=map[r], kids=t.members.filter(m=>m.parentId===r); return {id:r,owner:owner.name,short:owner.shortName||owner.name[0],avatar:owner.avatarColor,members:kids.map(k=>k.name).join('、')||'独立结算户',consume:fc[r]||0,paid:fp[r]||0,net:(fp[r]||0)-(fc[r]||0)}}); let debt=fams.filter(f=>f.net<-.005).map(f=>[f,-f.net]), cred=fams.filter(f=>f.net>.005).map(f=>[f,f.net]), transfers=[]; let i=0,j=0; while(i<debt.length&&j<cred.length){let a=Math.min(debt[i][1],cred[j][1]);transfers.push({from:debt[i][0],to:cred[j][0],amount:a});debt[i][1]-=a;cred[j][1]-=a;if(debt[i][1]<=.005)i++;if(cred[j][1]<=.005)j++;} return {total,pc,pp,fams,transfers}}
function header(){let t=trip(), c=calc(), pct=t.budget?c.total/t.budget*100:0; return `<header class="hero"><div class="top"><button class="pill" onclick="openModal('projects')">当前项目 ▼</button><button class="pill newBtn" onclick="openModal('newProject')">+ 新建</button></div><div class="title">${t.name}</div><div class="metrics"><div><small>已支出</small><br><b>${money(c.total)}</b></div><div><small>预算</small><br><b>${money(t.budget)}</b></div><div><small>剩余</small><br><b>${money(t.budget-c.total)}</b></div></div><div class="progress"><div class="progressFill" style="width:${Math.min(100,pct)}%"></div><div class="progressText">${pct.toFixed(1)}%</div></div></header>`}
function avatar(m,cls='avatar'){return `<div class="${cls}" style="background:${m.avatarColor}">${m.shortName||m.name[0]}</div>`}
function render(){let t=trip(), c=calc(); let html=header()+`<section class="page ${tab==='members'?'active':''}">${pageMembers()}</section><section class="page ${tab==='expenses'?'active':''}">${pageExpenses()}</section><section class="page ${tab==='add'?'active':''}">${pageAdd()}</section><section class="page ${tab==='families'?'active':''}">${pageFamilies()}</section><section class="page ${tab==='more'?'active':''}">${pageMore()}</section><nav class="nav"><button onclick="setTab('members')">伙伴</button><button onclick="setTab('expenses')">流水</button><button class="add" onclick="openExpense()">＋</button><button onclick="setTab('families')">家庭</button><button onclick="setTab('more')">更多</button></nav>${modalHtml()}`; document.getElementById('app').innerHTML=html}
function setTab(x){tab=x;render()} function openModal(x){modal=x;render(); if(x==='reports') setTimeout(()=>renderReportTab('cat'),0)} function closeModal(){modal='';editing=null;render()}
function pageMembers(){let t=trip();return `<div class="card"><div style="display:flex;justify-content:space-between"><h2>出游伙伴</h2><button class="btn primary" onclick="editMember()">+ 添加</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px">${t.members.map(m=>`<div style="text-align:center" onclick="memberActions('${m.id}')">${avatar(m)}<div style="font-weight:900;margin-top:8px;font-size:13px">${m.isManager?'👑 ':''}${m.name}</div><div class="muted">${m.weight}份</div></div>`).join('')}</div></div>`}
function pageExpenses(){let t=trip(), arr=t.expenses.filter(e=>(!filters.date||e.date===filters.date)&&(!filters.cat||e.category===filters.cat)&&(!filters.payer||e.payerId===filters.payer)).sort((a,b)=>(a.date+a.category).localeCompare(b.date+b.category));let dates=[...new Set(t.expenses.map(e=>e.date))], payers=t.members; return `<div class="card"><h2>流水账</h2><div style="display:flex;gap:6px;margin:12px 0"><select onchange="filters.date=this.value;render()"><option value="">日期</option>${dates.map(d=>`<option ${filters.date===d?'selected':''}>${d}</option>`).join('')}</select><select onchange="filters.cat=this.value;render()"><option value="">类别</option>${CAT.map(d=>`<option ${filters.cat===d?'selected':''}>${d}</option>`).join('')}</select><select onchange="filters.payer=this.value;render()"><option value="">垫付人</option>${payers.map(p=>`<option value="${p.id}" ${filters.payer===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>${arr.map(e=>`<div class="item" onclick="viewExpense('${e.id}')"><div class="catIcon ${CAT_CLS[e.category]||'ico-other'}"></div><div style="flex:1;min-width:0"><div style="font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.remark||e.category}</div><div class="muted">${e.date} · ${e.category} · ${mm()[e.payerId]?.name||''}</div></div><b>${money(e.amount)}</b><button class="dots" onclick="event.stopPropagation();expenseActions('${e.id}')">⋯</button></div>`).join('')}</div>`}
function pageAdd(){return `<div class="card"><h2>记一笔</h2><p class="muted">点击中间＋进入真实录入表单。</p></div>`}
function pageFamilies(){let c=calc();return `<div class="card" style="background:linear-gradient(135deg,#0284c7,#0d9488 55%,#0f766e);color:white"><div class="muted" style="color:#ffffff99">家庭结算总览</div><div class="metrics"><div><small>家庭户</small><br><b>${c.fams.length}</b></div><div><small>总支出</small><br><b>${money(c.total)}</b></div><div><small>待转账</small><br><b>${money(c.fams.filter(f=>f.net<0).reduce((s,f)=>s-f.net,0))}</b></div></div></div>${c.fams.map(f=>`<div class="card"><div style="display:flex;gap:14px"><div class="circle" style="background:${f.avatar}">${f.short}</div><div style="flex:1"><h2>${f.owner}</h2><div class="muted">${f.members}</div></div><div style="text-align:right"><div class="muted">${f.net>0?'应收':'应转'}</div><div class="${f.net>0?'pos':'neg'}" style="font-weight:900">${money(Math.abs(f.net))}</div></div></div><div class="field"><div class="muted">应承担 / 已垫付</div><b>${money(f.consume)} / ${money(f.paid)}</b></div><button class="btn soft" onclick="familyDetail('${f.id}')">查看家庭明细</button></div>`).join('')}<div class="card"><h2>AA转账指令</h2>${c.transfers.map(s=>`<div style="background:#f0fdfa;border-radius:22px;padding:16px;margin-top:12px"><div style="display:flex;align-items:center;justify-content:space-between"><div style="text-align:center;width:42%"><div class="circle" style="margin:0 auto;background:${s.from.avatar}">${s.from.short}</div><b>${s.from.owner}</b></div><div style="font-size:24px;color:#0d9488;font-weight:900">→</div><div style="text-align:center;width:42%"><div class="circle" style="margin:0 auto;background:${s.to.avatar}">${s.to.short}</div><b>${s.to.owner}</b></div></div><div style="font-size:24px;font-weight:900;color:#0d9488;text-align:center;margin-top:10px">${money(s.amount)}</div></div>`).join('')}</div>`}
function pageMore(){return `<div class="card"><h2>更多</h2><div class="listrow" onclick="openModal('reports')"><b>报表中心</b><span class="muted">类别/日期/个人/家庭 ›</span></div><div class="listrow" onclick="openModal('share')"><b>分享与导出</b><span class="muted">转账/CSV/报告 ›</span></div><div class="listrow" onclick="openModal('backup')"><b>数据安全</b><span class="muted">备份/导入 ›</span></div><div class="listrow" onclick="openModal('projects')"><b>项目管理</b><span class="muted">切换/新建/删除 ›</span></div><div class="listrow"><b>账本检查</b><span class="pos">未发现异常</span></div></div>`}
function memberActions(id){editing=id;openModal('memberActions')} function editMember(id){editing=id||null;openModal('memberEdit')} function expenseActions(id){editing=id;openModal('expenseActions')} function viewExpense(id){editing=id;openModal('expenseView')} function openExpense(id){editing=id||null;tab='add';openModal('expenseEdit')}
function modalHtml(){if(!modal)return''; return `<div class="modal show"><div class="sheet">${modalContent()}</div></div>`}
function modalContent(){let t=trip(), map=mm(); if(modal==='memberActions'){let m=map[editing];return `<h2>${m.name}</h2><button class="btn soft" style="width:100%" onclick="editMember('${m.id}')">编辑成员</button><button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteMember('${m.id}')">删除成员</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`}
if(modal==='memberEdit'){let m=editing?map[editing]:{name:'',weight:1,isAdult:true,parentId:''};let adults=t.members.filter(x=>x.isAdult);return `<h2>${editing?'编辑':'添加'}成员</h2><label>姓名<input id="mName" value="${m.name||''}"></label><label>权重<input id="mWeight" type="number" step="0.1" value="${m.weight||1}"></label><label>归属家庭<select id="mParent"><option value="">独立结算户</option>${adults.filter(a=>a.id!==m.id).map(a=>`<option value="${a.id}" ${m.parentId===a.id?'selected':''}>${a.name}</option>`).join('')}</select></label><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveMember()">保存</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`}
if(modal==='expenseEdit'){let e=editing?t.expenses.find(x=>x.id===editing):{date:today(),amount:'',category:'餐饮美食',payerId:t.members[0].id,splitMode:'weight',participants:t.members.map(m=>m.id),exactAllocations:{}};return `<h2>${editing?'编辑':'记一笔'}</h2><label>金额<input id="eAmount" type="text" inputmode="decimal" value="${e.amount||''}"></label><label>日期<input id="eDate" type="date" value="${String(e.date).length===5?'2026-'+e.date:e.date}"></label><label>备注<input id="eRemark" value="${e.remark||''}"></label><label>类别<select id="eCat">${CAT.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>垫付人<select id="ePayer">${t.members.map(m=>`<option value="${m.id}" ${e.payerId===m.id?'selected':''}>${m.name}</option>`).join('')}</select></label><label>分摊方式<select id="eMode"><option value="weight" ${e.splitMode!=='exact'?'selected':''}>按权重</option><option value="exact" ${e.splitMode==='exact'?'selected':''}>指定金额</option></select></label><div class="modeBtns"><button type="button" class="active">按权重均摊</button><button type="button">指定金额</button></div><div class="field"><b>参与人 / 指定金额</b>${t.members.map(m=>`<label class="participantRow"><input type="checkbox" class="part" value="${m.id}" ${(e.participants||[]).includes(m.id)?'checked':''}><div class="left"><b>${m.name}</b><div class="muted">${m.parentName?('归属：'+m.parentName):'独立结算户'}</div></div><span class="weightBadge">${m.weight}份</span><input class="exact exactInput" data-id="${m.id}" placeholder="0.00" value="${(e.exactAllocations||{})[m.id]||''}"></label>`).join('')}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveExpense()">保存</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`}
if(modal==='expenseView'){let e=t.expenses.find(x=>x.id===editing), a=alloc(e);return `<h2>账目详情</h2><p><b>${e.remark}</b></p><p>${e.date} · ${e.category} · ${money(e.amount)}</p><div class="field">${Object.keys(a).map(id=>`${map[id]?.name||id}：${money(a[id])}`).join('<br>')}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="openExpense('${e.id}')">编辑</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">关闭</button>`}
if(modal==='expenseActions')return `<h2>账目操作</h2><button class="btn soft" style="width:100%" onclick="openExpense('${editing}')">编辑账目</button><button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteExpense('${editing}')">删除账目</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`;
if(modal==='projects')return `<h2>项目库</h2>${state.trips.map(tr=>`<div class="card" style="box-shadow:none"><b>${tr.id===state.activeTripId?'✓ ':''}${tr.name}</b><div class="muted">预算 ${money(tr.budget)}｜${tr.expenses.length}笔｜${tr.members.length}人</div><button class="btn soft" onclick="state.activeTripId='${tr.id}';save();closeModal()">切换</button> <button class="dots" onclick="editing='${tr.id}';openModal('projectActions')">⋯</button></div>`).join('')}<button class="btn primary" style="width:100%" onclick="openModal('newProject')">+ 新建旅行项目</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">关闭</button>`;
if(modal==='projectActions')return `<h2>项目操作</h2><button class="btn soft" style="width:100%" onclick="openModal('editProject')">编辑项目</button><button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteProject()">删除项目</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`;
if(modal==='newProject'||modal==='editProject'){let tr=modal==='editProject'?state.trips.find(x=>x.id===editing):{name:'',budget:10000};return `<h2>${modal==='newProject'?'新建':'编辑'}项目</h2><label>项目名<input id="pName" value="${tr.name}"></label><label>预算<input id="pBudget" type="number" value="${tr.budget}"></label>${modal==='newProject'?'<label><input type="checkbox" id="copyMembers" checked> 复制当前成员和家庭关系</label>':''}<button class="btn primary" style="width:100%;margin-top:12px" onclick="saveProject()">保存</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`}
if(modal==='backup')return `<h2>数据安全</h2><button class="btn soft" style="width:100%" onclick="downloadBackup(false)">备份当前项目</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="downloadBackup(true)">备份全部项目</button><div class="field"><input type="file" id="backupFile" accept=".json,application/json"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="importBackupFile()">导入为新项目</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`;
if(modal==='share')return `<h2>分享与导出</h2><button class="btn primary" style="width:100%" onclick="copySettle()">复制最终转账</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="copyFamilyText()">复制家庭核账文字</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="exportCSV()">导出CSV完整表</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>`;
if(modal==='reports'){
  return `<h2>报表中心</h2><div class="seg" style="margin:10px 0"><button class="btn primary" onclick="renderReportTab('cat')">类别</button><button class="btn soft" onclick="renderReportTab('date')">日期</button><button class="btn soft" onclick="renderReportTab('person')">个人</button><button class="btn soft" onclick="renderReportTab('family')">家庭</button></div><div id="reportBox"></div><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">关闭</button>`
}
return `<button onclick="closeModal()">关闭</button>`}
function saveMember(){let t=trip(), map=mm();let id=editing||('m_'+Date.now());let m=editing?map[editing]:{id,selected:true,isManager:false,isAdult:true,avatarColor:AVATAR_COLORS[t.members.length%AVATAR_COLORS.length]};m.name=document.getElementById('mName').value||'新成员';m.shortName=m.name.slice(0,2);m.weight=parseFloat(document.getElementById('mWeight').value)||1;m.parentId=document.getElementById('mParent').value||null;m.parentName=m.parentId?map[m.parentId].name:null;if(!editing)t.members.push(m);save();closeModal()}
function deleteMember(id){let t=trip(); if(!confirm('确定删除该成员？相关历史分摊可能受影响。'))return; t.members=t.members.filter(m=>m.id!==id); t.expenses.forEach(e=>{e.participants=(e.participants||[]).filter(x=>x!==id); if(e.exactAllocations)delete e.exactAllocations[id]});save();closeModal()}
function saveExpense(){let t=trip();let id=editing||('e_'+Date.now());let e=editing?t.expenses.find(x=>x.id===editing):{id};e.amount=parseFloat(String(document.getElementById('eAmount').value).replace('。','.'))||0;e.date=document.getElementById('eDate').value.slice(5);e.remark=document.getElementById('eRemark').value;e.category=document.getElementById('eCat').value;e.payerId=document.getElementById('ePayer').value;e.payerName=mm()[e.payerId].name;e.splitMode=document.getElementById('eMode').value;e.participants=[...document.querySelectorAll('.part:checked')].map(x=>x.value);e.exactAllocations={};document.querySelectorAll('.exact').forEach(x=>{if(x.value)e.exactAllocations[x.dataset.id]=parseFloat(x.value)||0});if(!editing)t.expenses.unshift(e);save();tab='expenses';closeModal()}
function deleteExpense(id){if(!confirm('确定删除该账目？'))return;let t=trip();t.expenses=t.expenses.filter(e=>e.id!==id);save();closeModal()}
function saveProject(){if(modal==='editProject'){let p=state.trips.find(x=>x.id===editing);p.name=document.getElementById('pName').value;p.budget=parseFloat(document.getElementById('pBudget').value)||0}else{let cur=trip(), cp=document.getElementById('copyMembers').checked;let nt={id:'trip_'+Date.now(),name:document.getElementById('pName').value||'新旅行',budget:parseFloat(document.getElementById('pBudget').value)||0,members:cp?clone(cur.members):[clone(cur.members.find(m=>m.isManager)||cur.members[0])],expenses:[]};state.trips.push(nt);state.activeTripId=nt.id}save();closeModal()}
function deleteProject(){if(state.trips.length<=1)return alert('至少保留一个项目');if(!confirm('确定删除当前项目？删除后不可恢复，建议先备份。'))return;state.trips=state.trips.filter(t=>t.id!==editing);state.activeTripId=state.trips[0].id;save();closeModal()}
function strip(o){if(Array.isArray(o))return o.map(strip);if(o&&typeof o==='object'){let r={};Object.keys(o).forEach(k=>{if(!['iconSrc','catBg','catBorder','color'].includes(k))r[k]=strip(o[k])});return r}return o}
function copyBackup(all){let db=all?state:{activeTripId:trip().id,trips:[trip()]};navigator.clipboard.writeText(JSON.stringify(strip(db))).then(()=>alert('已复制精简备份'))}
function importBackup(){try{let db=JSON.parse(document.getElementById('importText').value);(db.trips||[]).forEach(tr=>{tr.id='trip_'+Date.now()+Math.random().toString(16).slice(2);state.trips.push(tr);state.activeTripId=tr.id});normalize(state);save();closeModal()}catch(e){alert('备份格式不正确')}}
function copySettle(){let txt='【'+trip().name+' AA对账】\n'+calc().transfers.map(s=>`${s.from.owner} 转给 ${s.to.owner}：${money(s.amount)}`).join('\n');navigator.clipboard.writeText(txt).then(()=>alert('已复制'))}
function copyFamilyText(){let txt=calc().fams.map(f=>`${f.owner}\n成员：${f.members}\n应承担：${money(f.consume)}\n已垫付：${money(f.paid)}\n净额：${money(f.net)}`).join('\n\n');navigator.clipboard.writeText(txt).then(()=>alert('已复制'))}
function exportCSV(){let t=trip(), c=calc(), rows=[['日期','类别','备注','金额','垫付人','分摊方式',...t.members.map(m=>m.name),'分摊合计']];t.expenses.forEach(e=>{let a=alloc(e), vals=t.members.map(m=>(a[m.id]||0).toFixed(2));rows.push([e.date,e.category,e.remark,e.amount,e.payerName,e.splitMode==='exact'?'指定金额':'按权重',...vals,vals.reduce((s,x)=>s+Number(x),0).toFixed(2)])});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=t.name+'_AA明细.csv';a.click()}
function familyDetail(id){
  let t=trip(), map=mm(), f=calc().fams.find(x=>x.id===id);
  let rows=[];
  t.expenses.forEach(e=>{
    let a=alloc(e), famSum=0;
    Object.keys(a).forEach(mid=>{ if(rootOf(mid)===id) famSum+=a[mid]; });
    if(famSum>0.004){
      let people=t.members.filter(m=>m.id===id||m.parentId===id).map(m=>{
        let val=a[m.id]||0;
        return `<div class="personRow"><div class="left"><b>${m.name}</b><div class="muted">${m.parentName?('归属：'+m.parentName):'独立结算户'}</div></div><span class="weightBadge">${m.weight}份</span><b>${money(val)}</b></div>`;
      }).join('');
      rows.push(`<div class="billItem"><div class="billHead"><div><div class="meta">${e.date} · ${e.category}</div><div class="name">${e.remark||e.category}</div></div><div class="pricePill"><small>本家庭承担</small><b>${money(famSum)}</b></div></div><div class="billBody"><div class="muted">账单总额：${money(e.amount)}　分摊方式：${e.splitMode==='exact'?'指定金额':'按权重'}</div><div class="peopleBox">${people}</div></div></div>`);
    }
  });
  let html=`<div class="modal show" id="tmp"><div class="sheet" style="padding:0;overflow:hidden"><div style="background:linear-gradient(135deg,#0284c7,#0d9488 55%,#0f766e);color:white;padding:20px;border-radius:28px 28px 0 0"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><div style="opacity:.65;font-size:12px">家庭详细账单</div><h2 style="margin:6px 0 0">${f.owner}</h2><div style="opacity:.7;font-size:12px;margin-top:4px">${f.members}</div></div><button class="dots" style="background:rgba(255,255,255,.18);color:white" onclick="document.getElementById('tmp').remove()">×</button></div><div style="margin-top:16px;background:rgba(255,255,255,.16);border-radius:18px;padding:12px"><div style="opacity:.65;font-size:12px">合计承担</div><b style="font-size:24px">${money(f.consume)}</b></div></div><div style="padding:18px;max-height:70vh;overflow:auto">${rows.join('')}<button class="btn primary" style="width:100%;margin-top:10px" onclick="document.getElementById('tmp').remove()">关闭</button></div></div></div>`;
  document.getElementById('app').insertAdjacentHTML('beforeend',html);
}


function downloadJSON(obj, filename){let blob=new Blob([JSON.stringify(strip(obj),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function safeFileName(s){return String(s||'GoodFriends').replace(/[\\/:*?"<>|\s]+/g,'_')}
function downloadBackup(all){let now=new Date().toISOString().slice(0,10); if(all){downloadJSON(Object.assign({},state,{backupType:'allTrips',backupTime:new Date().toISOString()}),'GoodFriends_全部项目备份_'+now+'.json')}else{downloadJSON({activeTripId:trip().id,trips:[trip()],backupType:'currentTrip',backupTime:new Date().toISOString()},'GoodFriends_'+safeFileName(trip().name)+'_当前项目备份.json')}}
function importBackupFile(){let input=document.getElementById('backupFile');let file=input&&input.files&&input.files[0]; if(!file){alert('请先选择 .json 备份文件');return}let reader=new FileReader();reader.onload=function(){try{let db=JSON.parse(reader.result);let trips=db.trips||[];if(!trips.length){alert('备份里没有项目');return}let msg='检测到 '+trips.length+' 个项目：\n'+trips.map(t=>'- '+(t.name||'未命名')+'（'+((t.members||[]).length)+'人｜'+((t.expenses||[]).length)+'笔）').join('\n')+'\n\n将作为新项目导入，避免覆盖当前账本。';if(!confirm(msg))return;trips.forEach(tr=>{tr.id='trip_'+Date.now()+Math.random().toString(16).slice(2);if(state.trips.some(x=>x.name===tr.name))tr.name=tr.name+'（导入）';state.trips.push(tr);state.activeTripId=tr.id});normalize(state);save();closeModal();alert('导入完成，已作为新项目保存。')}catch(e){alert('备份文件格式不正确')}};reader.readAsText(file,'utf-8')}


function reportData(type){let t=trip(), c=calc(); if(type==='cat'){let m={};t.expenses.forEach(e=>m[e.category]=(m[e.category]||0)+Number(e.amount||0));return Object.keys(m).map(k=>({name:k,amount:m[k],sub:'占总支出 '+(c.total?m[k]/c.total*100:0).toFixed(1)+'%'})).sort((a,b)=>b.amount-a.amount)} if(type==='date'){let m={};t.expenses.forEach(e=>m[e.date]=(m[e.date]||0)+Number(e.amount||0));return Object.keys(m).sort().map(k=>({name:k,amount:m[k],sub:'当日消费合计'}))} if(type==='person'){return t.members.map(m=>({name:m.name,amount:c.pc[m.id]||0,sub:'垫付 '+money(c.pp[m.id]||0)+'｜净额 '+money((c.pp[m.id]||0)-(c.pc[m.id]||0))}))} return c.fams.map(f=>({name:f.owner,amount:f.consume,sub:'垫付 '+money(f.paid)+'｜净额 '+money(f.net)}));}
function renderReportTab(type){let box=document.getElementById('reportBox'); if(!box)return; let data=reportData(type), max=Math.max(1,...data.map(x=>x.amount)); box.innerHTML=data.map(x=>`<div class="field"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${x.name}</b><div class="muted">${x.sub}</div></div><b>${money(x.amount)}</b></div><div class="reportbar"><i style="width:${Math.max(3,x.amount/max*100)}%"></i></div></div>`).join('');}

render();
</script></body></html>
